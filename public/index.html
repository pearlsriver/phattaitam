<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Phật Tại Tâm</title>

    <meta name="description"
          content="Phật Tại Tâm – Âm nhạc, Phật pháp và những khoảng bình yên.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Georgia, "Times New Roman", serif;
            background: #f5f1e8;
            color: #3d352c;
            text-align: center;
        }

        .container {
            max-width: 800px;
            padding: 40px 25px;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.8;
        }

        .subtitle {
            opacity: 0.75;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Phật Tại Tâm</h1>

        <p class="subtitle">
            Âm nhạc · Phật pháp · Bình yên
        </p>

        <p>
            Một khoảng lặng giữa dòng đời.
        </p>

    </main>

</body>
</html>
