<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Library Archive</title>
  <meta name="description" content="Personal literature and music archive">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel allows JSX to run directly in this HTML file -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #09090b;
    }

    * {
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    function PersonalLibraryMediaHub() {
      const books = [
        {
          title: "The Wind-Up Bird Chronicle",
          author: "Haruki Murakami",
          category: "Literature",
          cover:
            "https://images.unsplash.com/photo-1512820790803-83ca734da794?q=80&w=1200&auto=format&fit=crop",
        },
        {
          title: "Norwegian Wood",
          author: "Haruki Murakami",
          category: "Novel",
          cover:
            "https://images.unsplash.com/photo-1495446815901-a7297e633e8d?q=80&w=1200&auto=format&fit=crop",
        },
        {
          title: "Meditations",
          author: "Marcus Aurelius",
          category: "Philosophy",
          cover:
            "https://images.unsplash.com/photo-1519682337058-a94d519337bc?q=80&w=1200&auto=format&fit=crop",
        },
      ];

      const music = [
        {
          title: "Late Night Jazz",
          artist: "Miles Davis",
          duration: "42 min",
        },
        {
          title: "City Lights",
          artist: "Lo-fi Collective",
          duration: "58 min",
        },
        {
          title: "Ambient Rain",
          artist: "Studio Drift",
          duration: "31 min",
        },
      ];

      return (
        <div className="min-h-screen bg-zinc-950 text-zinc-100 font-sans">
          <div className="flex">

            {/* Sidebar */}
            <aside className="w-72 border-r border-zinc-800 bg-zinc-900/80 backdrop-blur-xl p-6 hidden lg:flex flex-col justify-between min-h-screen sticky top-0">
              <div>
                <div className="flex items-center gap-3 mb-10">
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-300 to-orange-500 flex items-center justify-center text-black font-bold text-xl shadow-lg">
                    L
                  </div>

                  <div>
                    <h1 className="text-xl font-semibold tracking-wide">
                      Library Archive
                    </h1>
                    <p className="text-sm text-zinc-400">
                      Personal literature & music
                    </p>
                  </div>
                </div>

                <nav className="space-y-3">
                  {[
                    "Dashboard",
                    "Books",
                    "Music",
                    "Authors",
                    "Collections",
                    "Favorites",
                    "Recently Added",
                  ].map((item) => (
                    <button
                      key={item}
                      className={`w-full text-left px-4 py-3 rounded-2xl transition-all duration-200 ${
                        item === "Dashboard"
                          ? "bg-zinc-100 text-black font-medium"
                          : "hover:bg-zinc-800 text-zinc-300"
                      }`}
                    >
                      {item}
                    </button>
                  ))}
                </nav>
              </div>

              <div className="rounded-3xl bg-gradient-to-br from-zinc-800 to-zinc-900 p-5 border border-zinc-700 shadow-xl">
                <p className="text-sm text-zinc-400 mb-2">
                  Storage Usage
                </p>

                <div className="w-full bg-zinc-700 rounded-full h-3 overflow-hidden mb-3">
                  <div className="w-3/4 h-full bg-gradient-to-r from-amber-300 to-orange-500 rounded-full"></div>
                </div>

                <p className="text-sm text-zinc-300">
                  7.4 GB of 10 GB used
                </p>
              </div>
            </aside>

            {/* Main Content */}
            <main className="flex-1 p-6 lg:p-10">

              {/* Header */}
              <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-10">
                <div>
                  <h2 className="text-4xl font-bold tracking-tight">
                    Your Creative Archive
                  </h2>

                  <p className="text-zinc-400 mt-2 text-base max-w-2xl">
                    Organize literature, essays, music playlists, and personal
                    collections in one elegant digital library.
                  </p>
                </div>

                <div className="flex items-center gap-3">
                  <input
                    type="text"
                    placeholder="Search books, artists, collections..."
                    className="bg-zinc-900 border border-zinc-800 rounded-2xl px-5 py-3 w-full md:w-96 outline-none focus:ring-2 focus:ring-amber-400"
                  />

                  <button className="bg-gradient-to-r from-amber-300 to-orange-500 text-black px-6 py-3 rounded-2xl font-semibold shadow-lg hover:scale-105 transition-transform whitespace-nowrap">
                    Add New
                  </button>
                </div>
              </div>

              {/* Hero Banner */}
              <section className="rounded-[2rem] overflow-hidden bg-gradient-to-br from-zinc-900 via-zinc-800 to-zinc-900 border border-zinc-800 shadow-2xl mb-10">
                <div className="grid lg:grid-cols-2 gap-8 p-8 lg:p-12 items-center">

                  <div>
                    <span className="inline-block px-4 py-2 rounded-full bg-amber-300/10 text-amber-300 text-sm mb-5 border border-amber-300/20">
                      Featured Collection
                    </span>

                    <h3 className="text-5xl font-bold leading-tight mb-5">
                      Midnight Literature & Jazz Sessions
                    </h3>

                    <p className="text-zinc-400 text-lg leading-relaxed mb-8">
                      A curated experience combining reflective novels, ambient
                      music, and late-night reading aesthetics.
                    </p>

                    <div className="flex gap-4 flex-wrap">
                      <button className="bg-zinc-100 text-black px-6 py-3 rounded-2xl font-semibold hover:opacity-90">
                        Explore Collection
                      </button>

                      <button className="border border-zinc-700 px-6 py-3 rounded-2xl text-zinc-200 hover:bg-zinc-800">
                        Play Music
                      </button>
                    </div>
                  </div>

                  <div className="relative h-80 rounded-[2rem] overflow-hidden">
                    <img
                      src="https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1600&auto=format&fit=crop"
                      alt="Library"
                      className="w-full h-full object-cover"
                    />

                    <div className="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent"></div>
                  </div>

                </div>
              </section>

              {/* Grid Layout */}
              <div className="grid xl:grid-cols-3 gap-8">

                {/* Books */}
                <section className="xl:col-span-2 rounded-[2rem] bg-zinc-900 border border-zinc-800 p-6 shadow-xl">

                  <div className="flex items-center justify-between mb-6">
                    <div>
                      <h4 className="text-2xl font-semibold">
                        Recent Literature
                      </h4>

                      <p className="text-zinc-400 text-sm mt-1">
                        Your latest reading additions
                      </p>
                    </div>

                    <button className="text-sm text-amber-300 hover:underline">
                      View All
                    </button>
                  </div>

                  <div className="grid md:grid-cols-3 gap-5">
                    {books.map((book) => (
                      <div
                        key={book.title}
                        className="group rounded-3xl overflow-hidden bg-zinc-950 border border-zinc-800 hover:border-amber-300/40 transition-all duration-300 hover:-translate-y-1"
                      >
                        <div className="h-64 overflow-hidden">
                          <img
                            src={book.cover}
                            alt={book.title}
                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                          />
                        </div>

                        <div className="p-5">
                          <span className="text-xs uppercase tracking-widest text-amber-300">
                            {book.category}
                          </span>

                          <h5 className="text-lg font-semibold mt-2 leading-snug">
                            {book.title}
                          </h5>

                          <p className="text-zinc-400 mt-1 text-sm">
                            {book.author}
                          </p>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

                {/* Music */}
                <section className="rounded-[2rem] bg-zinc-900 border border-zinc-800 p-6 shadow-xl flex flex-col">

                  <div className="mb-6">
                    <h4 className="text-2xl font-semibold">
                      Music Library
                    </h4>

                    <p className="text-zinc-400 text-sm mt-1">
                      Ambient playlists & personal albums
                    </p>
                  </div>

                  <div className="space-y-4 flex-1">
                    {music.map((track, index) => (
                      <div
                        key={track.title}
                        className="flex items-center justify-between bg-zinc-950 border border-zinc-800 rounded-2xl p-4 hover:border-zinc-700 transition-colors"
                      >
                        <div className="flex items-center gap-4">
                          <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-300 to-orange-500 text-black font-bold flex items-center justify-center">
                            {index + 1}
                          </div>

                          <div>
                            <p className="font-medium">
                              {track.title}
                            </p>

                            <p className="text-sm text-zinc-400">
                              {track.artist}
                            </p>
                          </div>
                        </div>

                        <span className="text-sm text-zinc-500">
                          {track.duration}
                        </span>
                      </div>
                    ))}
                  </div>

                  <div className="mt-6 rounded-3xl bg-gradient-to-r from-amber-300 to-orange-500 p-5 text-black shadow-xl">
                    <p className="text-sm font-medium opacity-80">
                      Currently Playing
                    </p>

                    <h5 className="text-xl font-bold mt-1">
                      Golden Hour Piano
                    </h5>

                    <div className="mt-4 w-full bg-black/20 rounded-full h-2 overflow-hidden">
                      <div className="w-2/3 h-full bg-black rounded-full"></div>
                    </div>
                  </div>

                </section>
              </div>
            </main>
          </div>
        </div>
      );
    }

    // Start React application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PersonalLibraryMediaHub />);
  </script>
</body>
</html>
